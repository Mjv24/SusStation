<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04051a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sus Station — social deduction in space</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="gl"></canvas>
<div id="localTag" class="hidden">LOCAL TEST MODE</div>

<div id="home">
  <div class="homecard" id="homeCard">
    <div class="brand"><h1 class="logo">SUS<span>STATION</span></h1><div class="tag">Find the impostor. Don't get caught.</div></div>
    <div class="hrow"><div id="hPrev"></div><div class="hcol"><label class="lbl">Your name</label><input id="hName" class="inp" maxlength="12" placeholder="Enter a name" autocomplete="nickname"><button id="hCustom" class="btn glass" type="button"><i data-i="shirt"></i> Wardrobe</button></div></div>
    <div class="hacts">
      <div id="hCreateWrap"><button id="hCreate" class="btn primary big" type="button"><i data-i="users"></i> CREATE ROOM</button></div>
      <div class="or">or join a friend</div>
      <div class="hrow tight"><input id="hCode" class="inp code" maxlength="5" placeholder="CODE" autocomplete="off"><button id="hJoin" class="btn go" type="button">JOIN</button></div>
    </div>
    <div id="homeStatus"></div>
    <div class="feats"><span>4–15 players</span><span>5 maps</span><span>11 roles</span><span>Voice chat</span><span>Phone &amp; PC</span></div>
    <div class="foot">WASD / joystick · E use · Q kill · R report · V vent · F ability · M map</div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="topL" class="hidden"><div id="taskbar"><div></div><span>TOTAL TASKS COMPLETED</span></div>
    <div id="tasks"><div id="tasksHead"><span>Tasks</span><span class="chev">▾</span></div><div id="taskList"></div></div></div>
  <div id="roomTag" class="hidden"></div>
  <div id="topR">
    <button class="ib" id="bChat" type="button" title="Chat"><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="badge hidden" id="chatBadge">0</span></button>
    <button class="ib off" id="bMic" type="button" title="Microphone"></button>
    <button class="ib" id="bSpk" type="button" title="Voice audio"></button>
    <button class="ib" id="bMap" type="button" title="Map (M)" data-i="map"></button>
    <button class="ib" id="bMenu" type="button" title="Menu" data-i="menu"></button>
  </div>
  <div id="netpill" class="hidden"></div>
  <div id="sabBanner" class="hidden"></div>
  <div id="ventNav" class="hidden"></div>
  <div id="acts">
    <button class="ab" id="bUse" type="button"></button>
    <button class="ab" id="bReport" type="button"></button>
    <button class="ab" id="bKill" type="button"></button>
    <button class="ab" id="bVent" type="button"></button>
    <button class="ab" id="bSabo" type="button"></button>
    <button class="ab" id="bAb" type="button"></button>
  </div>
  <div id="lobbyBar" class="hidden">
    <button id="lbCode" type="button" title="Copy invite link"><i data-i="link"></i> <span id="lbCodeT"></span></button>
    <span id="lbCount"></span>
    <button class="btn glass" id="lbCustom" type="button"><i data-i="shirt"></i> Wardrobe</button>
    <button class="btn glass" id="lbSettings" type="button">Settings</button>
    <button class="btn glass small" id="lbBotAdd" type="button">+ <i data-i="bot"></i></button>
    <button class="btn glass small" id="lbBotRem" type="button">− <i data-i="bot"></i></button>
    <button class="btn go" id="lbStart" type="button">START</button>
    <span id="lbWait">Waiting for host to start…</span>
  </div>
</div>
<div id="chatPanel" class="hidden"><div class="chead"><span>Chat</span><button class="btn small glass" id="chatX" type="button">✕</button></div><div class="clog" id="chatLog"></div>
  <form class="cform" id="chatForm"><input id="chatIn" class="inp" maxlength="140" placeholder="Type a message…" autocomplete="off"><button class="btn primary">Send</button></form></div>
<div id="modal" class="modal hidden"><div class="mpanel"><div class="mhead"><span id="mTitle"></span><button class="mclose" id="mClose" type="button">✕</button></div><div id="mBody"></div></div></div>
<div id="meet" class="hidden"></div>
<div id="fx" class="fx hidden"></div>
<div id="toast"></div>
<div id="rot" class="hidden"><span data-i="rotate"></span> Rotate your phone for the best view <button type="button" id="rotX">✕</button></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>')</script>
<script src="js/util.js"></script>
<script src="js/maps.js"></script>
<script src="js/cosmetics.js"></script>
<script src="js/net.js"></script>
<script src="js/host.js"></script>
<script src="js/client.js"></script>
<script src="js/render.js"></script>
<script src="js/world3d.js"></script>
<script src="js/postfx.js"></script>
<script src="js/tasks.js"></script>
<script src="js/ui.js"></script>
<script src="js/voice.js"></script>
<script src="js/main.js"></script>
</body>
</html>
